
name: Cidades ESG - CI CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build e testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: esgdb
          POSTGRES_USER: esg
          POSTGRES_PASSWORD: esg_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U esg -d esgdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/esgdb
      DB_USER: esg
      DB_PASSWORD: esg_ci_test

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build e testes Maven
        run: mvn -B clean verify

      - name: Build Docker
        run: docker build -t cidades-esg:ci .

  publish:
    name: Publicar imagem
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir imagem
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Publicar imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}

  staging:
    name: Deploy staging
    needs: publish
    runs-on: [self-hosted, Windows, X64, esg-deploy]
    environment: staging

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          $env:GH_TOKEN |
            docker login ghcr.io -u $env:GITHUB_ACTOR --password-stdin
          if ($LASTEXITCODE -ne 0) { throw "Falha login GHCR" }

      - name: Deploy e teste staging
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:APP_IMAGE = "ghcr.io/$($env:GITHUB_REPOSITORY.ToLowerInvariant()):$env:GITHUB_SHA"

          $argsCompose = @(
            "compose", "-p", "esg-staging",
            "--env-file", "C:\esg-config\staging\.env",
            "-f", "docker-compose.deploy.yml"
          )

          docker @argsCompose pull app
          if ($LASTEXITCODE -ne 0) { throw "Falha no pull" }

          docker @argsCompose up -d --no-build
          if ($LASTEXITCODE -ne 0) { throw "Falha no deploy" }

          $ok = $false
          for ($i = 1; $i -le 20; $i++) {
            try {
              $health = Invoke-RestMethod `
                "http://localhost:8082/actuator/health" `
                -TimeoutSec 5
              if ($health.status -eq "UP") {
                $ok = $true
                break
              }
            } catch {}
            Start-Sleep -Seconds 5
          }

          if (-not $ok) { throw "Staging nao saudavel" }
          Write-Host "STAGING OK"

  production:
    name: Deploy producao
    needs: staging
    runs-on: [self-hosted, Windows, X64, esg-deploy]
    environment: production

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          $env:GH_TOKEN |
            docker login ghcr.io -u $env:GITHUB_ACTOR --password-stdin
          if ($LASTEXITCODE -ne 0) { throw "Falha login GHCR" }

      - name: Deploy e teste producao
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:APP_IMAGE = "ghcr.io/$($env:GITHUB_REPOSITORY.ToLowerInvariant()):$env:GITHUB_SHA"

          $argsCompose = @(
            "compose", "-p", "esg-production",
            "--env-file", "C:\esg-config\production\.env",
            "-f", "docker-compose.deploy.yml"
          )

          docker @argsCompose pull app
          if ($LASTEXITCODE -ne 0) { throw "Falha no pull" }

          docker @argsCompose up -d --no-build
          if ($LASTEXITCODE -ne 0) { throw "Falha no deploy" }

          $ok = $false
          for ($i = 1; $i -le 20; $i++) {
            try {
              $health = Invoke-RestMethod `
                "http://localhost:8083/actuator/health" `
                -TimeoutSec 5
              if ($health.status -eq "UP") {
                $ok = $true
                break
              }
            } catch {}
            Start-Sleep -Seconds 5
          }

          if (-not $ok) { throw "Producao nao saudavel" }
          Write-Host "PRODUCAO OK"

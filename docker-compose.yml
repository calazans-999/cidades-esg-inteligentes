
services:
  postgres:
    image: postgres:16-alpine
    container_name: esg-postgres-compose
    restart: unless-stopped

    environment:
      POSTGRES_DB: esgdb
      POSTGRES_USER: esg
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - esg-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esg -d esgdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: cidades-esg:1.0
    container_name: esg-app
    restart: unless-stopped

    ports:
      - "8081:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/esgdb
      SPRING_DATASOURCE_USERNAME: esg
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - esg-network

volumes:
  postgres_data:

networks:
  esg-network:
    driver: bridge
